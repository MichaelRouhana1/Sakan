<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Derived area check</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px #0004; line-height: 1.5; }
  .legend b { font-size: 15px; }
  .sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .lbl { background: #fff0; border: 0; box-shadow: none; font-weight: 600; color: #333; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const id = new URLSearchParams(location.search).get('area') || 'area:verdun';
const map = L.map('map', { zoomControl: false });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
Promise.all([fetch('area-polygons.geojson').then(r => r.json()), fetch('streets.geojson').then(r => r.json())]).then(([areas, streets]) => {
  const target = areas.features.find(f => f.properties.id === id);
  map.fitBounds(L.geoJSON(target).getBounds().pad(0.35));
  const others = L.geoJSON(areas, {
    filter: f => f.properties.id !== id,
    style: f => ({ color: '#555', weight: 1.5, dashArray: '4 4', fillOpacity: 0.04 }),
    onEachFeature: (f, l) => l.bindTooltip(f.properties.nameEn, { permanent: true, direction: 'center', className: 'lbl' }),
  }).addTo(map);
  const t = L.geoJSON(target, { style: { color: '#d7263d', weight: 3, fillColor: '#d7263d', fillOpacity: 0.12 } }).addTo(map);
  L.geoJSON(streets, {
    filter: f => f.properties.parent === id && !f.properties.hood,
    style: { color: '#1b4fd8', weight: 3, opacity: 0.85 },
  }).addTo(map);
  const p = target.properties;
  const n = streets.features.filter(f => f.properties.parent === id && !f.properties.hood).length;
  const legend = L.control({ position: 'topright' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = `<b>${p.nameEn}</b> (${p.id})<br>${p.provenance}, ${p.areaKm2} km², search radius ${p.radiusM} m<br>` +
      `<span class="sw" style="background:#d7263d33;border:2px solid #d7263d"></span>derived area` +
      `&nbsp;&nbsp;<span class="sw" style="border:1px dashed #555"></span>other mapped areas<br>` +
      `<span class="sw" style="background:#1b4fd8"></span>${n} streets parented here (seed)`;
    return d;
  };
  legend.addTo(map);
  window.__ready = true;
});
</script>
</body>
</html>
